<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Thông báo tài khoản EduBridge." />
  <title>Thông báo - EduBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="index.html">EduBridge</a>
      <nav class="nav">
        <a href="index.html#cach-hoat-dong">Cách hoạt động</a>
        <a href="index.html#loi-ich">Lợi ích</a>
        <a id="nav-auth-link" href="dang-nhap.html">Đăng nhập</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <section class="wrap auth-page-wrap">
      <div class="auth-form profile-card">
        <h1>Thông báo</h1>
        <p class="auth-note">Thông báo tài khoản và các hồ sơ gia sư cần duyệt (đối với admin).</p>
        <button type="button" class="btn btn-secondary" id="mark-read-btn">Đánh dấu đã đọc tất cả</button>
        <ul id="notify-list" class="history-list"></ul>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span class="logo">EduBridge</span>
      <p>© 2026 — Trang demo kết nối gia sư & học viên.</p>
    </div>
  </footer>

  <script type="module" src="auth-nav.js"></script>
  <script type="module">
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { auth } from "./firebase-config.js";

    var DEFAULT_ADMIN_EMAIL = "admin@edubridge.demo";
    var listEl = document.getElementById("notify-list");
    var markReadBtn = document.getElementById("mark-read-btn");
    var currentEmail = "";
    var isAdmin = false;

    function readNotifications() {
      try {
        return JSON.parse(localStorage.getItem("edubridge_notifications") || "[]");
      } catch (e) {
        return [];
      }
    }

    function writeNotifications(notifications) {
      localStorage.setItem("edubridge_notifications", JSON.stringify(notifications));
    }

    function formatTime(value) {
      try {
        return new Date(value).toLocaleString("vi-VN");
      } catch (e) {
        return "";
      }
    }

    function readTutorRegistrations() {
      try {
        return JSON.parse(localStorage.getItem("edubridge_tutor_registrations") || "[]");
      } catch (e) {
        return [];
      }
    }

    function writeTutorRegistrations(registrations) {
      localStorage.setItem("edubridge_tutor_registrations", JSON.stringify(registrations));
    }

    function getAdminEmail() {
      var custom = localStorage.getItem("edubridge_admin_email");
      return (custom || DEFAULT_ADMIN_EMAIL).trim().toLowerCase();
    }

    function updateTutorStatus(tutorEmail, status, reason) {
      var nowIso = new Date().toISOString();
      var registrations = readTutorRegistrations();
      var updatedName = "Gia sư";
      registrations = registrations.map(function (item) {
        if (String(item.email || "").toLowerCase() !== tutorEmail) {
          return item;
        }
        updatedName = item.name || updatedName;
        return {
          id: item.id,
          email: item.email,
          name: item.name,
          subject: item.subject,
          level: item.level,
          experience: item.experience,
          location: item.location,
          availableTime: item.availableTime,
          price: Number(item.price || 0),
          sessionHours: Number(item.sessionHours || 0),
          gender: item.gender || "female",
          rating: Number(item.rating || 4),
          activeState: item.activeState || "available",
          status: status,
          rejectReason: status === "rejected" ? String(reason || "").trim() : "",
          submittedAt: item.submittedAt || nowIso,
          updatedAt: nowIso
        };
      });
      writeTutorRegistrations(registrations);

      var notifications = readNotifications();
      notifications.unshift({
        id: Date.now(),
        userEmail: tutorEmail,
        type: "tutor-approval-status",
        text: status === "approved"
          ? "Hồ sơ gia sư của bạn đã được admin duyệt. Bạn có thể chỉnh sửa và đăng lên bảng tìm gia sư."
          : "Hồ sơ gia sư của bạn chưa được duyệt. Lý do: " + (reason || "Chưa cung cấp") + ".",
        read: false,
        createdAt: nowIso,
        payload: {
          status: status,
          reason: reason || ""
        }
      });
      writeNotifications(notifications);
      window.dispatchEvent(new Event("edubridge-notifications-updated"));
      alert((status === "approved" ? "Đã duyệt" : "Đã từ chối") + " hồ sơ của " + updatedName + ".");
      render();
    }

    function render() {
      var notifications = readNotifications().filter(function (item) {
        return item.userEmail === currentEmail;
      });

      listEl.innerHTML = notifications.length
        ? notifications.map(function (item) {
            var unreadTag = item.read ? "" : " <strong>(Mới)</strong>";
            if (isAdmin && item.type === "tutor-approval-request" && item.payload && item.payload.tutorEmail) {
              return (
                '<li class="history-item">' +
                item.text + unreadTag +
                '<br><small>' + formatTime(item.createdAt) + "</small>" +
                '<div class="request-modal-actions">' +
                '<button type="button" class="btn btn-primary notify-approve-btn" data-email="' + item.payload.tutorEmail + '">Duyệt hồ sơ</button>' +
                '<button type="button" class="btn btn-secondary notify-reject-btn" data-email="' + item.payload.tutorEmail + '">Từ chối</button>' +
                "</div>" +
                "</li>"
              );
            }
            return '<li class="history-item">' + item.text + unreadTag + "<br><small>" + formatTime(item.createdAt) + "</small></li>";
          }).join("")
        : '<li class="history-item">Bạn chưa có thông báo nào.</li>';

      if (isAdmin) {
        var approveButtons = document.querySelectorAll(".notify-approve-btn");
        var rejectButtons = document.querySelectorAll(".notify-reject-btn");
        approveButtons.forEach(function (button) {
          button.addEventListener("click", function () {
            var tutorEmail = String(button.getAttribute("data-email") || "").toLowerCase();
            if (!tutorEmail) return;
            updateTutorStatus(tutorEmail, "approved");
          });
        });
        rejectButtons.forEach(function (button) {
          button.addEventListener("click", function () {
            var tutorEmail = String(button.getAttribute("data-email") || "").toLowerCase();
            if (!tutorEmail) return;
            var reason = prompt("Nhập lý do từ chối hồ sơ:", "") || "";
            updateTutorStatus(tutorEmail, "rejected", reason);
          });
        });
      }
    }

    markReadBtn.addEventListener("click", function () {
      var notifications = readNotifications().map(function (item) {
        if (item.userEmail === currentEmail) {
          item.read = true;
          return item;
        }
        return item;
      });
      writeNotifications(notifications);
      render();
      window.dispatchEvent(new Event("edubridge-notifications-updated"));
    });

    onAuthStateChanged(auth, function (user) {
      if (!user || !user.emailVerified) {
        window.location.href = "dang-nhap.html?next=thong-bao.html";
        return;
      }
      currentEmail = user.email || "";
      isAdmin = String(currentEmail).toLowerCase() === getAdminEmail();
      render();
    });
  </script>
</body>
</html>
