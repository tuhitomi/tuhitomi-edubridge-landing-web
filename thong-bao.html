<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Thông báo tài khoản EduBridge." />
  <title>Thông báo - EduBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="index.html">EduBridge</a>
      <nav class="nav">
        <a href="index.html#cach-hoat-dong">Cách hoạt động</a>
        <a href="index.html#loi-ich">Lợi ích</a>
        <a id="nav-auth-link" href="dang-nhap.html">Đăng nhập</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <section class="wrap auth-page-wrap">
      <div class="auth-form profile-card">
        <h1>Thông báo</h1>
        <p class="auth-note">Thông báo tài khoản và các hồ sơ gia sư cần duyệt (đối với admin).</p>
        <button type="button" class="btn btn-secondary" id="mark-read-btn">Đánh dấu đã đọc tất cả</button>
        <ul id="notify-list" class="history-list"></ul>
      </div>
    </section>
  </main>

  <div id="notify-detail-modal" class="request-modal" hidden>
    <div class="request-modal-content">
      <h2>Chi tiết thông báo</h2>
      <p id="notify-detail-text" class="auth-note"></p>
      <p id="notify-detail-time" class="form-note"></p>
      <pre id="notify-detail-payload" class="history-item"></pre>
      <div class="request-modal-actions">
        <button type="button" class="btn btn-secondary" id="notify-detail-close-btn">Đóng</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span class="logo">EduBridge</span>
      <p>© 2026 — Trang demo kết nối gia sư & học viên.</p>
    </div>
  </footer>

  <script type="module" src="auth-nav.js?v=1"></script>
  <script type="module">
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { 
      collection, 
      query, 
      where, 
      getDocs, 
      addDoc, 
      updateDoc, 
      doc, 
      writeBatch 
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    import { auth, db } from "./firebase-config.js";

    var DEFAULT_ADMIN_EMAIL = "tu620014@gmail.com";
    var listEl = document.getElementById("notify-list");
    var markReadBtn = document.getElementById("mark-read-btn");
    var detailModalEl = document.getElementById("notify-detail-modal");
    var detailTextEl = document.getElementById("notify-detail-text");
    var detailTimeEl = document.getElementById("notify-detail-time");
    var detailPayloadEl = document.getElementById("notify-detail-payload");
    var detailCloseBtn = document.getElementById("notify-detail-close-btn");
    var MODERATOR_KEY = "edubridge_moderator_emails";
    var currentEmail = "";
    var canReviewTutor = false;

    async function readNotifications(userEmail) {
      try {
        if (!userEmail) return [];
        const snapshot = await db.collection('notifications')
          .where('userEmail', '==', userEmail.toLowerCase())
          .get();
        return snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
      } catch (e) {
        console.error('Error reading notifications:', e);
        return [];
      }
    }

    async function writeNotifications(notifications) {
      const collectionRef = db.collection('notifications');
      try {
        const snapshot = await collectionRef.get();
        const batch = db.batch();
        snapshot.docs.forEach(doc => batch.delete(doc.ref));
        await batch.commit();
      } catch (e) {
        console.warn('Không thể xóa thông báo cũ', e);
      }
      for (const item of notifications) {
        await collectionRef.doc(String(item.id)).set(item);
      }
    }

    function formatTime(value) {
      try {
        return new Date(value).toLocaleString("vi-VN");
      } catch (e) {
        return "";
      }
    }

    async function readTutorRegistrations() {
      try {
        const snapshot = await db.collection('tutor_registrations').get();
        return snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
      } catch (e) {
        return [];
      }
    }

    async function writeTutorRegistrations(registrations) {
      const collectionRef = db.collection('tutor_registrations');
      const snapshot = await collectionRef.get();
      const batch = db.batch();
      snapshot.docs.forEach(doc => batch.delete(doc.ref));
      await batch.commit();
      for (const item of registrations) {
        await collectionRef.doc(item.id).set(item);
      }
    }

    async function getAdminEmail() {
      return DEFAULT_ADMIN_EMAIL;
    }

    async function getModeratorEmails() {
      return [];
    }

    async function getVisibleNotifications() {
      return await readNotifications(currentEmail);
    }

    async function updateNotificationReadState(notificationId, shouldRead) {
      try {
        // Update the specific notification document
        const notificationRef = db.collection('notifications').doc(notificationId.toString());
        await notificationRef.update({ read: !!shouldRead });
        
        // Dispatch event to update badge
        window.dispatchEvent(new Event("edubridge-notifications-updated"));
      } catch (error) {
        console.error('Error updating notification read state:', error);
      }
    }

    async function openDetail(notificationId) {
      const notifications = await getVisibleNotifications();
      var item = notifications.find(function (entry) {
        return Number(entry.id || 0) === Number(notificationId || 0);
      });
      if (!item) return;

      updateNotificationReadState(item.id, true);
      detailTextEl.textContent = item.text || "(Không có nội dung)";
      detailTimeEl.textContent = "Thời gian: " + formatTime(item.createdAt) + " • Loại: " + (item.type || "general");
      detailPayloadEl.textContent = item.payload ? JSON.stringify(item.payload, null, 2) : "Không có dữ liệu bổ sung.";
      detailModalEl.hidden = false;
      render();
    }

    function closeDetail() {
      detailModalEl.hidden = true;
    }

    async function updateTutorStatus(tutorEmail, status, reason) {
      var nowIso = new Date().toISOString();
      
      // Find and update the specific tutor registration
      const registrations = await readTutorRegistrations();
      var updatedName = "Gia sư";
      var tutorDoc = null;
      
      for (const item of registrations) {
        if (String(item.email || "").toLowerCase() === tutorEmail) {
          updatedName = item.name || updatedName;
          tutorDoc = item;
          break;
        }
      }
      
      if (tutorDoc) {
        // Update the tutor registration document
        const tutorRef = db.collection('tutor_registrations').doc(tutorDoc.id);
        await tutorRef.update({
          status: status,
          rejectReason: status === "rejected" ? String(reason || "").trim() : "",
          updatedAt: nowIso
        });
        
        // Add notification for the tutor
        const notificationData = {
          userEmail: tutorEmail,
          type: "tutor-approval-status",
          text: status === "approved"
            ? "Hồ sơ gia sư của bạn đã được admin duyệt. Bạn có thể chỉnh sửa và đăng lên bảng tìm gia sư."
            : "Hồ sơ gia sư của bạn chưa được duyệt. Lý do: " + (reason || "Chưa cung cấp") + ".",
          read: false,
          createdAt: nowIso,
          payload: {
            status: status,
            reason: reason || ""
          }
        };
        
        await db.collection('notifications').add(notificationData);
        
        window.dispatchEvent(new Event("edubridge-notifications-updated"));
        await render();
      }
    }

    async function render() {
      var notifications = await getVisibleNotifications();

      listEl.innerHTML = notifications.length
        ? notifications.map(function (item) {
            var unreadTag = item.read ? "" : " <strong>(Mới)</strong>";
            var toggleReadLabel = item.read ? "Đánh dấu chưa đọc" : "Đánh dấu đã đọc";
            var toggleReadValue = item.read ? "false" : "true";
            if (canReviewTutor && item.type === "tutor-approval-request" && item.payload && item.payload.tutorEmail) {
              return (
                '<li class="history-item">' +
                item.text + unreadTag +
                '<br><small>' + formatTime(item.createdAt) + "</small>" +
                '<div class="request-modal-actions">' +
                '<a class="btn btn-secondary" href="admin.html?tutorEmail=' + encodeURIComponent(String(item.payload.tutorEmail || "").toLowerCase()) + '">Mở trang quản trị</a>' +
                '<button type="button" class="btn btn-secondary notify-detail-btn" data-id="' + item.id + '">Xem chi tiết</button>' +
                '<button type="button" class="btn btn-secondary notify-toggle-read-btn" data-id="' + item.id + '" data-read="' + toggleReadValue + '">' + toggleReadLabel + "</button>" +
                '<button type="button" class="btn btn-primary notify-approve-btn" data-email="' + item.payload.tutorEmail + '">Duyệt hồ sơ</button>' +
                '<button type="button" class="btn btn-secondary notify-reject-btn" data-email="' + item.payload.tutorEmail + '">Từ chối</button>' +
                "</div>" +
                "</li>"
              );
            }
            return (
              '<li class="history-item">' + item.text + unreadTag + "<br><small>" + formatTime(item.createdAt) + "</small>" +
              '<div class="request-modal-actions">' +
              '<button type="button" class="btn btn-secondary notify-detail-btn" data-id="' + item.id + '">Xem chi tiết</button>' +
              '<button type="button" class="btn btn-secondary notify-toggle-read-btn" data-id="' + item.id + '" data-read="' + toggleReadValue + '">' + toggleReadLabel + "</button>" +
              "</div>" +
              "</li>"
            );
          }).join("")
        : '<li class="history-item">Bạn chưa có thông báo nào.</li>';

      var detailButtons = document.querySelectorAll(".notify-detail-btn");
      var toggleReadButtons = document.querySelectorAll(".notify-toggle-read-btn");
      detailButtons.forEach(function (button) {
        button.addEventListener("click", async function () {
          var id = Number(button.getAttribute("data-id") || 0);
          if (!id) return;
          await openDetail(id);
        });
      });
      toggleReadButtons.forEach(function (button) {
        button.addEventListener("click", async function () {
          var id = Number(button.getAttribute("data-id") || 0);
          var shouldRead = String(button.getAttribute("data-read") || "") === "true";
          if (!id) return;
          await updateNotificationReadState(id, shouldRead);
          await render();
        });
      });

      if (canReviewTutor) {
        var approveButtons = document.querySelectorAll(".notify-approve-btn");
        var rejectButtons = document.querySelectorAll(".notify-reject-btn");
        approveButtons.forEach(function (button) {
          button.addEventListener("click", async function () {
            var tutorEmail = String(button.getAttribute("data-email") || "").toLowerCase();
            if (!tutorEmail) return;
            await updateTutorStatus(tutorEmail, "approved");
          });
        });
        rejectButtons.forEach(function (button) {
          button.addEventListener("click", async function () {
            var tutorEmail = String(button.getAttribute("data-email") || "").toLowerCase();
            if (!tutorEmail) return;
            var reason = prompt("Nhập lý do từ chối hồ sơ:", "") || "";
            await updateTutorStatus(tutorEmail, "rejected", reason);
          });
        });
      }
    }

    markReadBtn.addEventListener("click", async function () {
      try {
        // Get all unread notifications for current user
        const notifications = await readNotifications(currentEmail);
        const unreadNotifications = notifications.filter(item => !item.read);
        
        // Update each unread notification
        const batch = db.batch();
        unreadNotifications.forEach(notification => {
          const notificationRef = db.collection('notifications').doc(notification.id);
          batch.update(notificationRef, { read: true });
        });
        
        await batch.commit();
        
        window.dispatchEvent(new Event("edubridge-notifications-updated"));
        await render();
      } catch (error) {
        console.error('Error marking all notifications as read:', error);
      }
    });

    detailCloseBtn.addEventListener("click", closeDetail);
    detailModalEl.addEventListener("click", function (event) {
      if (event.target === detailModalEl) closeDetail();
    });

    onAuthStateChanged(auth, async function (user) {
      if (!user) {
        window.location.href = "dang-nhap.html?next=thong-bao.html";
        return;
      }
      currentEmail = String(user.email || "").trim().toLowerCase();
      var normalizedEmail = currentEmail;
      var adminEmail = await getAdminEmail();
      var moderatorEmails = await getModeratorEmails();
      canReviewTutor = normalizedEmail === adminEmail || moderatorEmails.includes(normalizedEmail);
      if (!user.emailVerified && !canReviewTutor) {
        window.location.href = "dang-nhap.html?next=thong-bao.html";
        return;
      }
      await render();
    });
  </script>
</body>
</html>
