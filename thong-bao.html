<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Thông báo tài khoản EduBridge." />
  <title>Thông báo - EduBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="index.html">EduBridge</a>
      <nav class="nav">
        <a href="index.html#cach-hoat-dong">Cách hoạt động</a>
        <a href="index.html#loi-ich">Lợi ích</a>
        <a id="nav-auth-link" href="dang-nhap.html">Đăng nhập</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <section class="wrap auth-page-wrap">
      <div class="auth-form profile-card">
        <h1>Thông báo</h1>
        <p class="auth-note">Thông báo tài khoản và các hồ sơ gia sư cần duyệt (đối với admin).</p>
        <button type="button" class="btn btn-secondary" id="mark-read-btn">Đánh dấu đã đọc tất cả</button>
        <ul id="notify-list" class="history-list"></ul>
      </div>
    </section>
  </main>

  <div id="notify-detail-modal" class="request-modal" hidden>
    <div class="request-modal-content">
      <h2>Chi tiết thông báo</h2>
      <p id="notify-detail-text" class="auth-note"></p>
      <p id="notify-detail-time" class="form-note"></p>
      <pre id="notify-detail-payload" class="history-item"></pre>
      <div class="request-modal-actions">
        <button type="button" class="btn btn-secondary" id="notify-detail-close-btn">Đóng</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span class="logo">EduBridge</span>
      <p>© 2026 — Trang demo kết nối gia sư & học viên.</p>
    </div>
  </footer>

  <script type="module" src="auth-nav.js?v=1"></script>
  <script type="module">
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { 
      collection, 
      query, 
      where, 
      getDocs, 
      addDoc, 
      updateDoc, 
      doc, 
      writeBatch,
      orderBy,
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    import { auth, db } from "./firebase-config.js";

    var DEFAULT_ADMIN_EMAIL = "tu620014@gmail.com";
    var listEl = document.getElementById("notify-list");
    var markReadBtn = document.getElementById("mark-read-btn");
    var detailModalEl = document.getElementById("notify-detail-modal");
    var detailTextEl = document.getElementById("notify-detail-text");
    var detailTimeEl = document.getElementById("notify-detail-time");
    var detailPayloadEl = document.getElementById("notify-detail-payload");
    var detailCloseBtn = document.getElementById("notify-detail-close-btn");
    var MODERATOR_KEY = "edubridge_moderator_emails";
    var currentEmail = "";
    var canReviewTutor = false;
    var notificationsUnsubscribe = null;

    function formatTime(value) {
      try {
        return new Date(value).toLocaleString("vi-VN");
      } catch (e) {
        return "";
      }
    }

    async function getAdminEmail() {
      try {
        const docSnap = await getDocs(query(collection(db, 'settings'), where('key', '==', 'edubridge_admin_email')));
        if (!docSnap.empty) {
          return docSnap.docs[0].data().value.trim().toLowerCase();
        }
      } catch (e) {
        console.error('Error getting admin email:', e);
      }
      return DEFAULT_ADMIN_EMAIL.trim().toLowerCase();
    }

    async function getModeratorEmails() {
      try {
        const docSnap = await getDocs(query(collection(db, 'settings'), where('key', '==', 'edubridge_moderator_emails')));
        if (!docSnap.empty) {
          const value = docSnap.docs[0].data().value;
          if (Array.isArray(value)) {
            return value.map(email => String(email || "").trim().toLowerCase()).filter(email => email);
          }
        }
      } catch (e) {
        console.error('Error getting moderator emails:', e);
      }
      return [];
    }

    async function findTutorByEmail(tutorEmail) {
      try {
        const normalizedEmail = tutorEmail.toLowerCase().trim();
        const q = query(collection(db, 'tutor_registrations'), where('email', '==', normalizedEmail));
        const snapshot = await getDocs(q);
        return snapshot.empty ? null : { id: snapshot.docs[0].id, ...snapshot.docs[0].data() };
      } catch (e) {
        console.error('Error finding tutor by email:', e);
        return null;
      }
    }

    async function updateNotificationReadState(notificationId, shouldRead) {
      try {
        // Atomic update: Update the specific notification document
        const notificationRef = doc(db, 'notifications', notificationId);
        await updateDoc(notificationRef, { read: !!shouldRead });
        
        // Dispatch event to update badge
        window.dispatchEvent(new Event("edubridge-notifications-updated"));
      } catch (error) {
        console.error('Error updating notification read state:', error);
      }
    }

    async function openDetail(notificationId) {
      try {
        // Query the specific notification
        const notificationRef = doc(db, 'notifications', notificationId);
        const notificationSnap = await getDocs(query(collection(db, 'notifications'), where('__name__', '==', notificationRef)));
        if (notificationSnap.empty) return;
        
        const item = { id: notificationSnap.docs[0].id, ...notificationSnap.docs[0].data() };
        
        // Mark as read
        await updateNotificationReadState(item.id, true);
        
        detailTextEl.textContent = item.text || "(Không có nội dung)";
        detailTimeEl.textContent = "Thời gian: " + formatTime(item.createdAt) + " • Loại: " + (item.type || "general");
        detailPayloadEl.textContent = item.payload ? JSON.stringify(item.payload, null, 2) : "Không có dữ liệu bổ sung.";
        detailModalEl.hidden = false;
      } catch (error) {
        console.error('Error opening notification detail:', error);
      }
    }

    function closeDetail() {
      detailModalEl.hidden = true;
    }

    async function updateTutorStatus(tutorEmail, status, reason) {
      // Kiểm tra quyền Admin/Moderator trước khi thực thi
      const currentUser = auth.currentUser;
      if (!currentUser || !currentUser.email) {
        alert('Bạn cần đăng nhập để thực hiện thao tác này.');
        return;
      }
      
      const normalizedUserEmail = currentUser.email.toLowerCase().trim();
      const adminEmail = await getAdminEmail();
      const moderatorEmails = await getModeratorEmails();
      const isAdmin = normalizedUserEmail === adminEmail;
      const isModerator = moderatorEmails.includes(normalizedUserEmail);
      
      if (!isAdmin && !isModerator) {
        alert('Bạn không có quyền duyệt hồ sơ gia sư.');
        return;
      }
      
      try {
        const normalizedTutorEmail = tutorEmail.toLowerCase().trim();
        const nowIso = new Date().toISOString();
        
        // Query tutor registration directly by email
        const tutorDoc = await findTutorByEmail(normalizedTutorEmail);
        if (!tutorDoc) {
          alert('Không tìm thấy hồ sơ gia sư.');
          return;
        }
        
        // Atomic update: Update tutor registration document
        const tutorRef = doc(db, 'tutor_registrations', tutorDoc.id);
        await updateDoc(tutorRef, {
          status: status,
          rejectReason: status === "rejected" ? String(reason || "").trim() : "",
          updatedAt: nowIso
        });
        
        // Atomic update: Add notification for the tutor
        const notificationData = {
          userEmail: normalizedTutorEmail,
          type: "tutor-approval-status",
          text: status === "approved"
            ? "Hồ sơ gia sư của bạn đã được duyệt. Bạn có thể chỉnh sửa và đăng lên bảng tìm gia sư."
            : "Hồ sơ gia sư của bạn chưa được duyệt. Lý do: " + (reason || "Chưa cung cấp") + ".",
          read: false,
          createdAt: nowIso,
          payload: {
            status: status,
            reason: reason || ""
          }
        };
        
        await addDoc(collection(db, 'notifications'), notificationData);
        
        window.dispatchEvent(new Event("edubridge-notifications-updated"));
        
        alert(status === "approved" ? "Đã duyệt hồ sơ gia sư thành công." : "Đã từ chối hồ sơ gia sư.");
      } catch (error) {
        console.error('Error updating tutor status:', error);
        alert('Có lỗi xảy ra khi cập nhật trạng thái hồ sơ.');
      }
    }

    function renderNotifications(notifications) {
      listEl.innerHTML = notifications.length
        ? notifications.map(function (item) {
            var unreadTag = item.read ? "" : " <strong>(Mới)</strong>";
            var toggleReadLabel = item.read ? "Đánh dấu chưa đọc" : "Đánh dấu đã đọc";
            var toggleReadValue = item.read ? "false" : "true";
            if (canReviewTutor && item.type === "tutor-approval-request" && item.payload && item.payload.tutorEmail) {
              return (
                '<li class="history-item">' +
                item.text + unreadTag +
                '<br><small>' + formatTime(item.createdAt) + "</small>" +
                '<div class="request-modal-actions">' +
                '<a class="btn btn-secondary" href="admin.html?tutorEmail=' + encodeURIComponent(String(item.payload.tutorEmail || "").toLowerCase().trim()) + '">Mở trang quản trị</a>' +
                '<button type="button" class="btn btn-secondary notify-detail-btn" data-id="' + item.id + '">Xem chi tiết</button>' +
                '<button type="button" class="btn btn-secondary notify-toggle-read-btn" data-id="' + item.id + '" data-read="' + toggleReadValue + '">' + toggleReadLabel + "</button>" +
                '<button type="button" class="btn btn-primary notify-approve-btn" data-email="' + String(item.payload.tutorEmail || "").toLowerCase().trim() + '">Duyệt hồ sơ</button>' +
                '<button type="button" class="btn btn-secondary notify-reject-btn" data-email="' + String(item.payload.tutorEmail || "").toLowerCase().trim() + '">Từ chối</button>' +
                "</div>" +
                "</li>"
              );
            }
            return (
              '<li class="history-item">' + item.text + unreadTag + "<br><small>" + formatTime(item.createdAt) + "</small>" +
              '<div class="request-modal-actions">' +
              '<button type="button" class="btn btn-secondary notify-detail-btn" data-id="' + item.id + '">Xem chi tiết</button>' +
              '<button type="button" class="btn btn-secondary notify-toggle-read-btn" data-id="' + item.id + '" data-read="' + toggleReadValue + '">' + toggleReadLabel + "</button>" +
              "</div>" +
              "</li>"
            );
          }).join("")
        : '<li class="history-item">Bạn chưa có thông báo nào.</li>';

      // Attach event listeners
      var detailButtons = document.querySelectorAll(".notify-detail-btn");
      var toggleReadButtons = document.querySelectorAll(".notify-toggle-read-btn");
      
      detailButtons.forEach(function (button) {
        button.addEventListener("click", async function () {
          var id = button.getAttribute("data-id");
          if (!id) return;
          await openDetail(id);
        });
      });
      
      toggleReadButtons.forEach(function (button) {
        button.addEventListener("click", async function () {
          var id = button.getAttribute("data-id");
          var shouldRead = button.getAttribute("data-read") === "true";
          if (!id) return;
          await updateNotificationReadState(id, shouldRead);
        });
      });

      if (canReviewTutor) {
        var approveButtons = document.querySelectorAll(".notify-approve-btn");
        var rejectButtons = document.querySelectorAll(".notify-reject-btn");
        
        approveButtons.forEach(function (button) {
          button.addEventListener("click", async function () {
            var tutorEmail = button.getAttribute("data-email");
            if (!tutorEmail) return;
            await updateTutorStatus(tutorEmail, "approved");
          });
        });
        
        rejectButtons.forEach(function (button) {
          button.addEventListener("click", async function () {
            var tutorEmail = button.getAttribute("data-email");
            if (!tutorEmail) return;
            var reason = prompt("Nhập lý do từ chối hồ sơ:", "") || "";
            await updateTutorStatus(tutorEmail, "rejected", reason);
          });
        });
      }
    }

    markReadBtn.addEventListener("click", async function () {
      if (!currentEmail) return;
      
      try {
        // Query all unread notifications for current user
        const normalizedEmail = currentEmail.toLowerCase().trim();
        const q = query(
          collection(db, 'notifications'),
          where('userEmail', '==', normalizedEmail),
          where('read', '==', false)
        );
        const snapshot = await getDocs(q);
        
        if (snapshot.empty) return;
        
        // Batch update all unread notifications
        const batch = writeBatch(db);
        snapshot.docs.forEach(docSnap => {
          batch.update(docSnap.ref, { read: true });
        });
        
        await batch.commit();
        
        window.dispatchEvent(new Event("edubridge-notifications-updated"));
      } catch (error) {
        console.error('Error marking all notifications as read:', error);
      }
    });

    detailCloseBtn.addEventListener("click", closeDetail);
    detailModalEl.addEventListener("click", function (event) {
      if (event.target === detailModalEl) closeDetail();
    });

    onAuthStateChanged(auth, async function (user) {
      // Cleanup previous listener
      if (notificationsUnsubscribe) {
        notificationsUnsubscribe();
        notificationsUnsubscribe = null;
      }
      
      if (!user) {
        window.location.href = "dang-nhap.html?next=thong-bao.html";
        return;
      }
      
      currentEmail = user.email.toLowerCase().trim();
      const adminEmail = await getAdminEmail();
      const moderatorEmails = await getModeratorEmails();
      canReviewTutor = currentEmail === adminEmail || moderatorEmails.includes(currentEmail);
      
      if (!user.emailVerified && !canReviewTutor) {
        window.location.href = "dang-nhap.html?next=thong-bao.html";
        return;
      }
      
      // Set up real-time listener for notifications
      const q = query(
        collection(db, 'notifications'),
        where('userEmail', '==', currentEmail),
        orderBy('createdAt', 'desc')
      );
      
      notificationsUnsubscribe = onSnapshot(q, (snapshot) => {
        try {
          const notifications = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          renderNotifications(notifications);
        } catch (error) {
          console.error('Error rendering notifications:', error);
          listEl.innerHTML = '<li class="history-item">Có lỗi khi tải thông báo.</li>';
        }
      }, (error) => {
        console.error('Error listening to notifications:', error);
        listEl.innerHTML = '<li class="history-item">Có lỗi khi tải thông báo.</li>';
      });
    });
  </script>
</body>
</html>
