<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Đăng nhập tài khoản EduBridge và xác thực email." />
  <title>Đăng nhập - EduBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="index.html">EduBridge</a>
      <nav class="nav">
        <a href="index.html#cach-hoat-dong">Cách hoạt động</a>
        <a href="index.html#loi-ich">Lợi ích</a>
        <a id="nav-auth-link" href="dang-nhap.html">Đăng nhập</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <section class="wrap auth-page-wrap">
      <form class="auth-form auth-form-single" action="#" method="POST" id="login-form">
        <h1>Đăng nhập</h1>
        <p class="auth-note">Đăng nhập bằng email đã đăng ký và đã kích hoạt tài khoản.</p>
        <label>
          Email
          <input type="email" name="identity" autocomplete="email" required placeholder="email@example.com" />
        </label>
        <label>
          Mật khẩu
          <input type="password" name="password" autocomplete="current-password" required placeholder="Nhập mật khẩu" />
        </label>
        <button type="submit" class="btn btn-primary btn-block">Đăng nhập</button>
        <p id="login-status" class="auth-status"></p>
        <p class="auth-links">
          <a href="quen-mat-khau.html">Quên mật khẩu?</a>
          <span>Chưa có tài khoản? <a href="dang-ky.html">Đăng ký</a></span>
        </p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span class="logo">EduBridge</span>
      <p>© 2026 — Trang demo kết nối gia sư & học viên.</p>
    </div>
  </footer>
  <script type="module" src="auth-nav.js?v=1"></script>
  <script type="module">
    import { sendEmailVerification, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { auth } from "./firebase-config.js";

    var form = document.getElementById("login-form");
    var statusEl = document.getElementById("login-status");
    if (!form || !statusEl) {
      throw new Error("Form đăng nhập không tồn tại.");
    }

    var params = new URLSearchParams(window.location.search);
    var nextPage = params.get("next") || "index.html";

    function setStatus(message) {
      statusEl.textContent = message;
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      setStatus("");

      var formData = new FormData(form);
      var identity = String(formData.get("identity") || "").trim();
      var password = String(formData.get("password") || "");

      if (identity.indexOf("@") === -1) {
        setStatus("Firebase đang đăng nhập bằng email. Vui lòng nhập email để đăng nhập.");
        return;
      }

      try {
        var credential = await signInWithEmailAndPassword(auth, identity, password);
        await credential.user.reload();

        if (!credential.user.emailVerified) {
          await sendEmailVerification(credential.user);
          await signOut(auth);
          setStatus("Email chưa kích hoạt. Hệ thống đã gửi lại link kích hoạt, vui lòng kiểm tra email.");
          return;
        }

        window.location.href = nextPage;
      } catch (error) {
        setStatus("Đăng nhập thất bại: " + (error && error.message ? error.message : "lỗi không xác định."));
      }
    });
  </script>
</body>
</html>
