<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Danh sách gia sư EduBridge với bộ lọc tìm kiếm." />
  <title>Tìm gia sư - EduBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="index.html">EduBridge</a>
      <nav class="nav">
        <a href="index.html#cach-hoat-dong">Cách hoạt động</a>
        <a href="index.html#loi-ich">Lợi ích</a>
        <a id="nav-auth-link" href="dang-nhap.html">Đăng nhập</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <section class="wrap tutor-search-section">
      <h1 class="section-title">Danh sách gia sư</h1>
      <p class="section-intro">Lọc theo nhu cầu học tập và gửi yêu cầu trực tiếp đến gia sư phù hợp.</p>

      <form class="tutor-filters" id="tutor-filters">
        <label>
          Từ khóa
          <input type="text" id="filter-keyword" placeholder="Tên gia sư, môn học..." />
        </label>
        <label>
          Môn học
          <select id="filter-subject">
            <option value="">Tất cả môn</option>
            <option value="toan">Toán</option>
            <option value="tieng-anh">Tiếng Anh</option>
            <option value="hoa">Hóa học</option>
            <option value="vat-ly">Vật lý</option>
            <option value="van">Ngữ văn</option>
          </select>
        </label>
        <label>
          Hình thức
          <select id="filter-mode">
            <option value="">Tất cả hình thức</option>
            <option value="online">Online</option>
            <option value="offline">Offline</option>
          </select>
        </label>
        <label>
          Mức học phí tối đa (VND/buổi)
          <input type="number" id="filter-price" min="0" step="50000" placeholder="Ví dụ: 300000" />
        </label>
        <label>
          Khu vực
          <input type="text" id="filter-area" placeholder="Quận/Huyện hoặc Online" />
        </label>
        <label>
          Giới tính
          <select id="filter-gender">
            <option value="">Tất cả</option>
            <option value="female">Nữ</option>
            <option value="male">Nam</option>
          </select>
        </label>
        <label>
          Đánh giá tối thiểu
          <select id="filter-rating">
            <option value="0">Tất cả</option>
            <option value="3">Từ 3 sao</option>
            <option value="4">Từ 4 sao</option>
            <option value="4.5">Từ 4.5 sao</option>
          </select>
        </label>
        <label>
          Thời lượng 1 buổi
          <select id="filter-duration">
            <option value="">Tất cả</option>
            <option value="1.5">1.5 giờ</option>
            <option value="2">2 giờ</option>
            <option value="2.5">2.5 giờ</option>
            <option value="3">3 giờ</option>
          </select>
        </label>
      </form>

      <div id="tutor-list" class="tutor-list"></div>
      <p id="tutor-empty" class="tutor-empty" hidden>Không có gia sư phù hợp với bộ lọc hiện tại.</p>
    </section>
  </main>

  <div id="request-modal" class="request-modal" hidden>
    <div class="request-modal-content">
      <h2>Gửi yêu cầu gia sư</h2>
      <p id="request-modal-title" class="auth-note"></p>
      <label>
        Ghi chú thêm cho học viên
        <textarea id="request-note" rows="4" placeholder="Ví dụ: Mục tiêu học, lịch rảnh, nội dung muốn tập trung..."></textarea>
      </label>
      <div class="request-modal-actions">
        <button type="button" class="btn btn-secondary" id="request-cancel-btn">Hủy</button>
        <button type="button" class="btn btn-primary" id="request-submit-btn">Gửi yêu cầu</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span class="logo">EduBridge</span>
      <p>© 2026 — Trang demo kết nối gia sư & học viên.</p>
    </div>
  </footer>

  <script type="module" src="auth-nav.js"></script>
  <script type="module">
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { auth } from "./firebase-config.js";

    (function () {
      var tutors = [
        { id: 1, name: "Nguyễn Minh Anh", email: "gia-su1@edubridge.demo", subject: "toan", subjectLabel: "Toán", mode: "online", modeLabel: "Online", price: 220000, sessionHours: 2, level: "THCS - THPT", bio: "3 năm kinh nghiệm ôn thi vào 10 và THPT Quốc gia.", area: "Online", gender: "male", rating: 4.7, activeState: "available" },
        { id: 2, name: "Trần Thu Hà", email: "gia-su2@edubridge.demo", subject: "tieng-anh", subjectLabel: "Tiếng Anh", mode: "offline", modeLabel: "Offline", price: 300000, sessionHours: 1.5, level: "IELTS 5.5 - 7.0", bio: "Chuyên luyện giao tiếp và kỹ năng Speaking.", area: "Quận 1", gender: "female", rating: 4.9, activeState: "available" },
        { id: 3, name: "Lê Quang Huy", email: "gia-su3@edubridge.demo", subject: "vat-ly", subjectLabel: "Vật lý", mode: "online", modeLabel: "Online", price: 250000, sessionHours: 2.5, level: "Lớp 10 - 12", bio: "Dạy bám sát chương trình SGK và luyện đề.", area: "Online", gender: "male", rating: 4.5, activeState: "available" },
        { id: 4, name: "Phạm Ngọc Linh", email: "gia-su4@edubridge.demo", subject: "hoa", subjectLabel: "Hóa học", mode: "offline", modeLabel: "Offline", price: 280000, sessionHours: 2, level: "THPT", bio: "Tập trung nền tảng và giải nhanh bài tập trắc nghiệm.", area: "Quận 7", gender: "female", rating: 4.6, activeState: "busy" },
        { id: 5, name: "Đỗ Khánh Vy", email: "gia-su5@edubridge.demo", subject: "van", subjectLabel: "Ngữ văn", mode: "online", modeLabel: "Online", price: 200000, sessionHours: 3, level: "THCS", bio: "Giúp học sinh nắm bố cục và cải thiện kỹ năng viết.", area: "Online", gender: "female", rating: 4.3, activeState: "available" }
      ];

      var listEl = document.getElementById("tutor-list");
      var emptyEl = document.getElementById("tutor-empty");
      var keywordEl = document.getElementById("filter-keyword");
      var subjectEl = document.getElementById("filter-subject");
      var modeEl = document.getElementById("filter-mode");
      var priceEl = document.getElementById("filter-price");
      var areaEl = document.getElementById("filter-area");
      var genderEl = document.getElementById("filter-gender");
      var ratingEl = document.getElementById("filter-rating");
      var durationEl = document.getElementById("filter-duration");
      var activeUser = null;
      var selectedTutor = null;
      var modalEl = document.getElementById("request-modal");
      var modalTitleEl = document.getElementById("request-modal-title");
      var noteEl = document.getElementById("request-note");
      var modalSubmitBtn = document.getElementById("request-submit-btn");
      var modalCancelBtn = document.getElementById("request-cancel-btn");

      onAuthStateChanged(auth, function (user) {
        activeUser = user;
      });

      function formatPrice(price) {
        return price.toLocaleString("vi-VN") + " VND/buổi";
      }

      function readJson(key) {
        try {
          return JSON.parse(localStorage.getItem(key) || "[]");
        } catch (e) {
          return [];
        }
      }

      function writeJson(key, value) {
        localStorage.setItem(key, JSON.stringify(value));
      }

      var registeredTutors = readJson("edubridge_tutor_registrations")
        .filter(function (item) {
          return item && item.status === "approved";
        })
        .map(function (item, index) {
        return {
          id: 1000 + index,
          name: item.name || "Gia sư mới",
          email: item.email || "",
          subject: "custom",
          subjectLabel: item.subject || "Môn học khác",
          mode: item.location && item.location.toLowerCase().indexOf("online") !== -1 ? "online" : "offline",
          modeLabel: item.location && item.location.toLowerCase().indexOf("online") !== -1 ? "Online" : "Offline",
          area: item.location || "Chưa cập nhật",
          gender: String(item.gender || "").toLowerCase() || "male",
          rating: Number(item.rating || 4),
          price: Number(item.price || 250000),
          sessionHours: Number(item.sessionHours || 2),
          level: item.level || "Nhiều cấp độ",
          bio: item.experience || "Gia sư đã đăng ký trên hệ thống EduBridge.",
          activeState: item.activeState || "available"
        };
      });

      tutors = tutors.concat(registeredTutors);

      function openModal(tutor) {
        selectedTutor = tutor;
        modalTitleEl.textContent = "Gia sư: " + tutor.name + " (" + tutor.subjectLabel + ")";
        noteEl.value = "";
        modalEl.hidden = false;
      }

      function closeModal() {
        selectedTutor = null;
        modalEl.hidden = true;
      }

      function saveRequest(note) {
        if (!selectedTutor || !activeUser) return;

        var requests = readJson("edubridge_requests");
        requests.unshift({
          id: Date.now(),
          tutorId: selectedTutor.id,
          tutorName: selectedTutor.name,
          tutorEmail: selectedTutor.email,
          subject: selectedTutor.subjectLabel,
          studentEmail: activeUser.email,
          studentName: activeUser.displayName || activeUser.email,
          note: note,
          createdAt: new Date().toISOString(),
          respondBy: new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString(),
          status: "waiting_tutor",
          pricePerSession: Number(selectedTutor.price || 0),
          sessionHours: Number(selectedTutor.sessionHours || 2),
          monthlySessions: 8
        });
        writeJson("edubridge_requests", requests);

        var notifications = readJson("edubridge_notifications");
        notifications.unshift({
          id: Date.now() + 1,
          userEmail: selectedTutor.email,
          text: "Bạn có yêu cầu mới từ " + (activeUser.displayName || activeUser.email) + " cho môn " + selectedTutor.subjectLabel + ".",
          read: false,
          createdAt: new Date().toISOString()
        });
        notifications.unshift({
          id: Date.now() + 2,
          userEmail: activeUser.email,
          text: "Bạn đã gửi yêu cầu đến gia sư " + selectedTutor.name + ".",
          read: false,
          createdAt: new Date().toISOString()
        });
        writeJson("edubridge_notifications", notifications);
        window.dispatchEvent(new Event("edubridge-notifications-updated"));
      }

      function cardTemplate(tutor) {
        return (
          '<article class="tutor-card">' +
          '<h3>' + tutor.name + "</h3>" +
          '<p class="tutor-meta">' + tutor.subjectLabel + " • " + tutor.modeLabel + " • " + tutor.level + "</p>" +
          '<p class="tutor-bio">' + tutor.bio + "</p>" +
          '<p class="tutor-duration">Khu vực: ' + (tutor.area || "Chưa cập nhật") + ' • Đánh giá: ' + Number(tutor.rating || 0).toFixed(1) + " sao</p>" +
          '<p class="tutor-duration">1 buổi: ' + tutor.sessionHours + " giờ</p>" +
          '<p class="tutor-price">' + formatPrice(tutor.price) + "</p>" +
          '<button type="button" class="btn btn-primary btn-block tutor-request-btn" data-id="' + tutor.id + '" data-name="' + tutor.name + '">Gửi yêu cầu gia sư</button>' +
          "</article>"
        );
      }

      function getFilteredTutors() {
        var keyword = (keywordEl.value || "").toLowerCase().trim();
        var subject = subjectEl.value;
        var mode = modeEl.value;
        var maxPrice = Number(priceEl.value || 0);
        var area = (areaEl.value || "").toLowerCase().trim();
        var gender = genderEl.value;
        var minRating = Number(ratingEl.value || 0);
        var sessionHours = Number(durationEl.value || 0);

        return tutors.filter(function (tutor) {
          if ((tutor.activeState || "available") !== "available") return false;
          var byKeyword = !keyword || tutor.name.toLowerCase().includes(keyword) || tutor.subjectLabel.toLowerCase().includes(keyword);
          var bySubject = !subject || tutor.subject === subject;
          var byMode = !mode || tutor.mode === mode;
          var byPrice = !maxPrice || tutor.price <= maxPrice;
          var byArea = !area || String(tutor.area || "").toLowerCase().includes(area);
          var byGender = !gender || tutor.gender === gender;
          var byRating = !minRating || Number(tutor.rating || 0) >= minRating;
          var byDuration = !sessionHours || tutor.sessionHours === sessionHours;
          return byKeyword && bySubject && byMode && byPrice && byArea && byGender && byRating && byDuration;
        });
      }

      function render() {
        var filtered = getFilteredTutors();
        listEl.innerHTML = filtered.map(cardTemplate).join("");
        emptyEl.hidden = filtered.length !== 0;

        var buttons = document.querySelectorAll(".tutor-request-btn");
        buttons.forEach(function (button) {
          button.addEventListener("click", function () {
            if (!activeUser || !activeUser.emailVerified) {
              var next = encodeURIComponent("tim-gia-su.html");
              window.location.href = "dang-nhap.html?next=" + next;
              return;
            }

            var tutorId = Number(button.getAttribute("data-id") || 0);
            var tutor = tutors.find(function (item) {
              return item.id === tutorId;
            });

            if (!tutor) {
              alert("Không tìm thấy thông tin gia sư.");
              return;
            }

            openModal(tutor);
          });
        });
      }

      [keywordEl, subjectEl, modeEl, priceEl, areaEl, genderEl, ratingEl, durationEl].forEach(function (element) {
        element.addEventListener("input", render);
        element.addEventListener("change", render);
      });

      modalCancelBtn.addEventListener("click", closeModal);
      modalSubmitBtn.addEventListener("click", function () {
        if (!selectedTutor) return;
        var note = (noteEl.value || "").trim();
        var tutorName = selectedTutor.name;
        saveRequest(note);
        closeModal();
        alert("Đã gửi yêu cầu học với gia sư " + tutorName + ".");
      });

      render();
    })();
  </script>
</body>
</html>
