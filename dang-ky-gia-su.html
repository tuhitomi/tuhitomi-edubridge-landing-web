<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Biểu mẫu đăng ký làm gia sư tại EduBridge." />
  <title>Đăng ký làm gia sư - EduBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="index.html">EduBridge</a>
      <nav class="nav">
        <a href="index.html#cach-hoat-dong">Cách hoạt động</a>
        <a href="index.html#loi-ich">Lợi ích</a>
        <a id="nav-auth-link" href="dang-nhap.html">Đăng nhập</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <section class="wrap auth-page-wrap">
      <form class="auth-form auth-form-single" action="#" method="POST" id="tutor-register-form">
        <h1>Đăng ký làm gia sư</h1>
        <p class="auth-note">Điền đầy đủ thông tin để EduBridge duyệt hồ sơ. Khi admin duyệt, hồ sơ của bạn sẽ được hiển thị trên bảng tìm gia sư.</p>
        <label>
          Họ và tên
          <input type="text" name="full_name" autocomplete="name" required placeholder="Nguyễn Văn A" />
        </label>
        <label>
          Email
          <input type="email" name="email" autocomplete="email" required placeholder="email@example.com" />
        </label>
        <label>
          Số điện thoại
          <input type="tel" name="phone" autocomplete="tel" required placeholder="09xxxxxxxx" />
        </label>
        <label>
          Môn dạy chính
          <input type="text" name="subject" required placeholder="Toán, Tiếng Anh, Vật lý..." />
        </label>
        <label>
          Trình độ học viên có thể dạy
          <input type="text" name="level" required placeholder="Tiểu học, THCS, THPT, IELTS..." />
        </label>
        <label>
          Kinh nghiệm giảng dạy
          <textarea name="experience" rows="4" required placeholder="Mô tả ngắn kinh nghiệm, chứng chỉ, thành tích..."></textarea>
        </label>
        <label>
          Khu vực / hình thức dạy
          <input type="text" name="location" required placeholder="Online hoặc khu vực bạn nhận dạy" />
        </label>
        <label>
          Khung giờ rảnh
          <textarea name="available_time" rows="3" required placeholder="Ví dụ: T2-T6 từ 19h đến 21h"></textarea>
        </label>
        <label>
          Học phí tham khảo (VND/buổi)
          <input type="number" name="price" min="0" step="50000" placeholder="Ví dụ: 250000" />
        </label>
        <label>
          Thời lượng 1 buổi (giờ)
          <input type="number" name="session_hours" min="1" max="4" step="0.5" placeholder="Ví dụ: 2" />
        </label>
        <button type="submit" class="btn btn-primary btn-block">Gửi đăng ký gia sư</button>
        <p class="auth-links">
          <span>Cần đăng nhập tài khoản để gửi biểu mẫu này.</span>
        </p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span class="logo">EduBridge</span>
      <p>© 2026 — Trang demo kết nối gia sư & học viên.</p>
    </div>
  </footer>

  <script type="module" src="auth-nav.js?v=1"></script>
  <script type="module">
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { auth, db } from "./firebase-config.js";

    var DEFAULT_ADMIN_EMAIL = "tu620014@gmail.com";
    var form = document.getElementById("tutor-register-form");
    var activeUser = null;
    if (!form) {
      throw new Error("Form đăng ký gia sư không tồn tại.");
    }

    async function readJson(key, fallback) {
      try {
        const collectionName = key.replace('edubridge_', '');
        const snapshot = await db.collection(collectionName).get();
        return snapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
      } catch (e) {
        return fallback;
      }
    }

    async function writeJson(key, value) {
      const collectionName = key.replace('edubridge_', '');
      const collectionRef = db.collection(collectionName);
      const batch = db.batch();
      try {
        const snapshot = await collectionRef.get();
        snapshot.docs.forEach(doc => batch.delete(doc.ref));
      } catch (e) {
        console.warn('Không thể đọc trước khi ghi', collectionName, e);
      }
      await batch.commit();
      for (const item of value) {
        await collectionRef.doc(item.id).set(item);
      }
    }

    async function getAdminEmail() {
      // Tạm thời dùng mặc định để tránh lỗi offline
      return DEFAULT_ADMIN_EMAIL;
    }

    async function getReviewerEmails() {
      var adminEmail = await getAdminEmail();
      // Tạm thời bỏ qua moderator để tránh lỗi offline
      var moderatorEmails = [];
      var all = [adminEmail].concat(moderatorEmails).map(function (item) {
        return String(item || "").trim().toLowerCase();
      });
      return all.filter(function (item, index, arr) {
        return item && arr.indexOf(item) === index;
      });
    }

    async function setDocNoRead(collectionName, docId, data) {
      try {
        await db.collection(collectionName).doc(docId).set(data);
      } catch (e) {
        console.error('setDocNoRead failed', collectionName, docId, e);
        throw e;
      }
    }

    onAuthStateChanged(auth, function (user) {
      if (!user || !user.emailVerified) {
        window.location.href = "dang-nhap.html?next=dang-ky-gia-su.html";
        return;
      }
      activeUser = user;
    });

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      if (!activeUser || !activeUser.email) {
        alert("Bạn chưa đăng nhập. Vui lòng đăng nhập trước.");
        return;
      }

      try {
        var nowIso = new Date().toISOString();
        var formData = new FormData(form);
        var userEmail = String(activeUser.email || "").toLowerCase();
        var reviewerEmails = await getReviewerEmails();

        var tutorRecord = {
          id: Date.now(),
          email: userEmail,
          name: String(formData.get("full_name") || "").trim(),
          subject: String(formData.get("subject") || "").trim(),
          level: String(formData.get("level") || "").trim(),
          experience: String(formData.get("experience") || "").trim(),
          location: String(formData.get("location") || "").trim(),
          availableTime: String(formData.get("available_time") || "").trim(),
          price: Number(formData.get("price") || 0),
          sessionHours: Number(formData.get("session_hours") || 0),
          status: "pending",
          submittedAt: nowIso,
          updatedAt: nowIso
        };

        await setDocNoRead('tutor_registrations', activeUser.uid, tutorRecord);

        for (var index = 0; index < reviewerEmails.length; index++) {
          var reviewerEmail = reviewerEmails[index];
          var notification = {
            id: Date.now() + 1 + index,
            userEmail: reviewerEmail,
            type: "tutor-approval-request",
            read: false,
            createdAt: nowIso,
            text: "Có hồ sơ gia sư mới cần duyệt từ " + tutorRecord.name + " (" + userEmail + ").",
            payload: {
              tutorEmail: userEmail,
              tutorName: tutorRecord.name
            }
          };
          await setDocNoRead('notifications', notification.id.toString(), notification);
        }

        var userNotification = {
          id: Date.now() + 2,
          userEmail: userEmail,
          type: "tutor-approval-status",
          read: false,
          createdAt: nowIso,
          text: "Hồ sơ gia sư của bạn đã được gửi. Vui lòng chờ admin duyệt để hiển thị trên bảng tìm gia sư.",
          payload: {
            status: "pending"
          }
        };
        await setDocNoRead('notifications', userNotification.id.toString(), userNotification);
        window.dispatchEvent(new Event("edubridge-notifications-updated"));

        alert("Đăng ký thành công!");
        window.location.href = "profile.html";
      } catch (error) {
        console.error("Lỗi khi đăng ký:", error);
        alert("Lỗi: " + error.message);
      }
    });
  </script>
</body>
</html>
