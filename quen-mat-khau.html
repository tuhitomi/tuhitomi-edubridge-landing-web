<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Khôi phục mật khẩu tài khoản EduBridge." />
  <title>Quên mật khẩu - EduBridge</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo" href="index.html">EduBridge</a>
      <nav class="nav">
        <a href="index.html#cach-hoat-dong">Cách hoạt động</a>
        <a href="index.html#loi-ich">Lợi ích</a>
        <a id="nav-auth-link" href="dang-nhap.html">Đăng nhập</a>
      </nav>
    </div>
  </header>

  <main class="auth-page">
    <section class="wrap auth-page-wrap">
      <form class="auth-form auth-form-single" action="#" method="POST" id="forgot-form">
        <h1>Quên mật khẩu</h1>
        <p class="auth-note">Nhập email đã đăng ký, chúng tôi sẽ gửi hướng dẫn đặt lại mật khẩu.</p>
        <label>
          Email
          <input type="email" name="email" autocomplete="email" required placeholder="email@example.com" />
        </label>
        <button type="submit" class="btn btn-primary btn-block">Gửi yêu cầu</button>
        <p id="forgot-status" class="auth-status"></p>
        <p class="auth-links">
          <span>Nhớ mật khẩu rồi? <a href="dang-nhap.html">Quay lại đăng nhập</a></span>
        </p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <span class="logo">EduBridge</span>
      <p>© 2026 — Trang demo kết nối gia sư & học viên.</p>
    </div>
  </footer>
  <script type="module" src="auth-nav.js"></script>
  <script type="module">
    import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { auth } from "./firebase-config.js";

    var form = document.getElementById("forgot-form");
    var statusEl = document.getElementById("forgot-status");
    if (!form || !statusEl) {
      throw new Error("Form quên mật khẩu không tồn tại.");
    }

    function setStatus(message) {
      statusEl.textContent = message;
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      setStatus("");

      var formData = new FormData(form);
      var email = String(formData.get("email") || "").trim();

      try {
        await sendPasswordResetEmail(auth, email);
        setStatus("Đã gửi email đặt lại mật khẩu. Vui lòng kiểm tra hộp thư.");
      } catch (error) {
        setStatus("Không gửi được email: " + (error && error.message ? error.message : "lỗi không xác định."));
      }
    });
  </script>
</body>
</html>
